        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
        outline: none;
        transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s, background-color 0.25s;
        color: #8c6328;
      }
      .music-toggle-btn:hover {

        animation: music-spin 4s linear infinite;

      .music-toggle-btn.is-muted {
        opacity: 0.65;
        filter: grayscale(0.5);
      }

        animation: none;

    <script>
      (function() {
        var audio = document.getElementById('wedding-audio');
        var btn = document.getElementById('music-toggle');
        var introOverlay = document.getElementById('wedding-guest-intro');
        var introForm = document.getElementById('intro-form');
        var guestInput = document.getElementById('guest-name-input');

        var userInteracted = false;
        var isMuted = false;

        function updateBtn() {
          if (!btn) return;
          if (audio && !audio.paused) {
            btn.classList.add('is-playing');
            btn.classList.remove('is-muted');
          } else {
            btn.classList.remove('is-playing');
            btn.classList.add('is-muted');
          }
        }

        function tryPlay() {
          if (isMuted || !audio) return;
          var p = audio.play();
          if (p !== undefined) {
            p.then(function() {
              updateBtn();
            }).catch(function() {
              updateBtn();
            });
          }
        }

        // Handle Intro Form Submission
        if (introForm) {
          introForm.addEventListener('submit', function(e) {
            e.preventDefault();
            var guestName = (guestInput ? guestInput.value : '').trim();
            if (!guestName) {
              if (guestInput) guestInput.focus();
              return;
            }

            try {
              sessionStorage.setItem('guest_name', guestName);
            } catch(err) {}

            syncRsvpLinks();

            userInteracted = true;
            isMuted = false;
            tryPlay();

            // Smooth exit animation
            if (introOverlay) {
              introOverlay.style.opacity = '0';
              introOverlay.style.transform = 'scale(1.05)';
              introOverlay.style.pointerEvents = 'none';
            }

            document.body.classList.remove('intro-locked');

            setTimeout(function() {
              if (introOverlay && introOverlay.parentNode) {
                introOverlay.parentNode.removeChild(introOverlay);
              }
            }, 820);
          });
        }

        // WhatsApp RSVP Logic
        var rsvpData = (window.WEDDING_DATA && window.WEDDING_DATA.rsvp) || {
          title: "RSVP",
          teluguTitle: "ప్రత్యుత్తరం ఇవ్వండి",
          subtitle: "Your warm presence and blessings will make our celebrations truly special. Kindly confirm your attendance.",
          phone: "9885758054",
          whatsappNumber: "919885758054",
          formattedPhone: "+91 98857 58054",
          message: "Namaste! We are happy to confirm our presence for Vinay & Aparna's wedding celebrations on 30th October 2026."
        };

        function getWhatsAppUrl() {
          var guestName = '';
          try {
            guestName = (sessionStorage.getItem('guest_name') || '').trim();
          } catch(e) {}

          var number = rsvpData.whatsappNumber || "919885758054";
          var text = rsvpData.message || "Namaste! We are happy to confirm our presence for Vinay & Aparna's wedding celebrations on 30th October 2026.";
          if (guestName) {
            text = "Namaste! This is " + guestName + ". We are happy to confirm our presence for Vinay & Aparna's wedding celebrations on 30th October 2026.";
          }
          return "https://wa.me/" + number + "?text=" + encodeURIComponent(text);
        }

        var floatRsvpBtn = document.getElementById('whatsapp-rsvp-floating');
        function syncRsvpLinks() {
          var url = getWhatsAppUrl();
          if (floatRsvpBtn) {
            floatRsvpBtn.href = url;
          }
          var cardBtn = document.getElementById('rsvp-card-btn');
          if (cardBtn) {
            cardBtn.href = url;
          }
        }

        if (floatRsvpBtn) {
          syncRsvpLinks();
          floatRsvpBtn.addEventListener('click', function() {
            floatRsvpBtn.href = getWhatsAppUrl();
          });
        }

        function injectRsvpSection() {
          if (document.getElementById('wedding-rsvp-section')) return;
          var main = document.querySelector('main');
          var footer = document.querySelector('footer');
          if (main && footer) {
            var section = document.createElement('section');
            section.id = 'wedding-rsvp-section';
            section.className = 'wedding-rsvp-section';
            section.innerHTML =
              '<div class="wedding-rsvp-card">' +
                '<span class="rsvp-tag-telugu">' + (rsvpData.teluguTitle || 'ప్రత్యుత్తరం ఇవ్వండి') + '</span>' +
                '<p class="rsvp-eyebrow">' + (rsvpData.title || 'RSVP') + '</p>' +
                '<h2 class="rsvp-heading">Celebrate With Us</h2>' +
                '<p class="rsvp-text">' + (rsvpData.subtitle || 'Your warm presence and blessings will make our celebrations truly special. Kindly confirm your attendance.') + '</p>' +
                '<a id="rsvp-card-btn" class="rsvp-main-btn" href="' + getWhatsAppUrl() + '" target="_blank" rel="noopener noreferrer">' +
