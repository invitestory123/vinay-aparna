    <style>
      .music-toggle-btn {
        position: fixed;
        top: 18px;
        right: 18px;
        z-index: 9999;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(255, 253, 248, 0.94);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1.5px solid rgba(185, 138, 47, 0.55);
        box-shadow: 0 4px 16px rgba(61, 43, 31, 0.18), 0 0 0 3px rgba(255, 255, 255, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
        outline: none;
        transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s, background-color 0.25s;
        color: #8c6328;
      }
      .music-toggle-btn:hover {
        transform: scale(1.08);
        background: #ffffff;
        box-shadow: 0 6px 20px rgba(61, 43, 31, 0.25), 0 0 0 4px rgba(255, 255, 255, 0.8);
      }
      .music-toggle-btn:active {
        transform: scale(0.92);
      }
      .music-icon-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
      }
      .music-toggle-btn.is-playing .music-icon-wrap svg {
        animation: music-spin 4s linear infinite;
      }
      .music-toggle-btn.is-muted {
        opacity: 0.65;
        filter: grayscale(0.5);
      }
      .music-toggle-btn.is-muted .music-icon-wrap svg {
        animation: none;
      }
      .music-toggle-btn .music-slash {
        display: none;
      }
      .music-toggle-btn.is-muted .music-slash {
        display: block;
      }
      @keyframes music-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
    <script src="./editable/wedding-data.js"></script>
    <script type="module" crossorigin src="assets/index-BcS--ptf.js"></script>
    <link rel="stylesheet" crossorigin href="assets/index-yVHCWpVH.css">
  </head>
  <body>
    <audio id="wedding-audio" loop preload="auto" playsinline src="editable/assets/bgm.mp3">
      <source src="editable/assets/bgm.mp3" type="audio/mpeg" />
    </audio>

    <button id="music-toggle" class="music-toggle-btn is-playing" aria-label="Toggle background music" title="Toggle background music">
      <span class="music-icon-wrap">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
          <line class="music-slash" x1="2" y1="2" x2="22" y2="22" stroke="#b91c1c" stroke-width="2.5"></line>
        </svg>
      </span>
    </button>

    <div id="root"></div>

    <script>
      (function() {
        var audio = document.getElementById('wedding-audio');
        var btn = document.getElementById('music-toggle');
        if (!audio || !btn) return;

        var userInteracted = false;
        var isMuted = false;

        function updateBtn() {
          if (!audio.paused) {
            btn.classList.add('is-playing');
            btn.classList.remove('is-muted');
          } else {
            btn.classList.remove('is-playing');
            btn.classList.add('is-muted');
          }
        }

        function tryPlay() {
          if (isMuted) return;
          var p = audio.play();
          if (p !== undefined) {
            p.then(function() {
              updateBtn();
            }).catch(function() {
              updateBtn();
            });
          }
        }

        function unlockAudio() {
          if (userInteracted || isMuted) return;
          userInteracted = true;
          tryPlay();
          ['click', 'touchstart', 'pointerdown', 'scroll', 'keydown'].forEach(function(evt) {
            window.removeEventListener(evt, unlockAudio, { capture: true });
          });
        }

        ['click', 'touchstart', 'pointerdown', 'scroll', 'keydown'].forEach(function(evt) {
          window.addEventListener(evt, unlockAudio, { capture: true, once: true, passive: true });
        });

        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          userInteracted = true;
          if (audio.paused) {
            isMuted = false;
            tryPlay();
          } else {
            isMuted = true;
            audio.pause();
            updateBtn();
          }
        });

        audio.addEventListener('play', updateBtn);
        audio.addEventListener('pause', updateBtn);

        document.addEventListener('DOMContentLoaded', tryPlay);
        window.addEventListener('load', tryPlay);
      })();
    </script>
  </body>
